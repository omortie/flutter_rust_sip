[package]
name = "flutter_rust_sip"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.99"
flutter_rust_bridge = { git = "https://github.com/shri-acha/flutter_rust_bridge", rev = "d1c1957a045825434c86ef6bc936c3299431c5fb" }
lazy_static = "1.5.0"
log = "0.4.27"
pjsip-sys = { git="https://github.com/omortie/pjsip-sys.git" }
thiserror = "2.0.16"
tokio = { version = "1", features = ["full"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
